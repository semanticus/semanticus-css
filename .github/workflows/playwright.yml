name: CI checks
on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      update_snapshots:
        description: 'Regenerate visual snapshots'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate visual snapshots'
        type: boolean
        default: false
jobs:
  test:
    timeout-minutes: 60
    runs-on: blacksmith-4vcpu-ubuntu-2404
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Build CSS
        run: npm run build

      - name: Initialize snapshots
        if: ${{inputs.update_snapshots == 'true'}}
        run: npx playwright test --update-snapshots --reporter html

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Playwright snapshots
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && inputs.update_snapshots }}
        with:
          name: playwright-snapshots
          path: tests/_snapshots/**
          retention-days: 7
