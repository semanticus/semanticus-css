name: CI checks
on:
  pull_request:
  push:
  workflow_call:
    inputs:
      update_snapshots:
        description: 'Regenerate visual snapshots'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate visual snapshots'
        type: boolean
        default: false
jobs:
  test:
    timeout-minutes: 60
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: useblacksmith/setup-node@v5
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run Lint
        run: npm run lint

      - name: Set up Playwright cache
        id: cache
        uses: actions/cache@v4
        with:
          key: cache/${{github.repository}}/${{github.ref}}
          restore-keys: cache/${{github.repository}}/refs/heads/master
          path: tests/**

      - name: Initialize snapshots
        if: ${{steps.cache.outputs.cache-hit != 'true' || inputs.update_snapshots == 'true'}}
        run: npx playwright test --update-snapshots --reporter html

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests/_report/**
          retention-days: 30

      - name: Upload Playwright snapshots
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && inputs.update_snapshots }}
        with:
          name: playwright-snapshots
          path: tests/_snaps/**
          retention-days: 7
